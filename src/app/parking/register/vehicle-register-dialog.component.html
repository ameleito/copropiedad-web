<h2 mat-dialog-title>Registrar vehículo</h2>

<mat-dialog-content>
  @if (errorMessage()) {
    <div class="error-banner" role="alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="form" class="dialog-form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Placa</mat-label>
      <input matInput formControlName="plate" (input)="onPlateInput()" autocomplete="off" />
      <mat-icon matPrefix>pin</mat-icon>
      @if (form.controls.plate.touched && form.controls.plate.hasError('required')) {
        <mat-error>La placa es obligatoria</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Marca</mat-label>
      <input matInput formControlName="brand" />
      <mat-icon matPrefix>directions_car</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Modelo</mat-label>
      <input matInput formControlName="model" />
      <mat-icon matPrefix>layers</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Color</mat-label>
      <input matInput formControlName="color" />
      <mat-icon matPrefix>palette</mat-icon>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="submitting()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()" [disabled]="submitting()">
    @if (submitting()) {
      <mat-progress-spinner diameter="20" mode="indeterminate" />
    } @else {
      Registrar
    }
  </button>
</mat-dialog-actions>
